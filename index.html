<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대포 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 사격장: 짙은 녹색 펠트 판 위에 붉은 과녁, 놋쇠색 포신과 발사 버튼. 위는 과녁판, 아래는 포대. */
  --felt:#18402f;
  --felt-deep:#0c231b;
  --brass:#e3a72f;
  --brass-deep:#9c6b17;
  --red:#c73a2b;
  --paper:#f4ecd9;
  --ink:#1c1a17;
  --chalk:#e6ede8;
  --muted:#9fb5ab;
  --font-display:"Black Han Sans","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--felt-deep);
  background-image:radial-gradient(ellipse at 50% 30%,var(--felt) 0%,var(--felt-deep) 78%);
  color:var(--chalk);font-family:var(--font-body);
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}

.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:12px 20px;border-bottom:2px solid rgba(227,167,47,.3);background:rgba(0,0,0,.2)}
.bar h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.6vw,36px);color:var(--brass);letter-spacing:.02em}
.count{font-size:clamp(15px,1.4vw,19px);color:var(--muted)}
.count b{color:var(--chalk);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-left:auto}
.field{display:flex;align-items:center;gap:8px;font-size:15px}
.stepper{display:flex;align-items:center;border:1px solid rgba(230,237,232,.28);border-radius:8px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:rgba(255,255,255,.07);color:var(--chalk);font-size:20px;cursor:pointer}
.stepper button:hover{background:rgba(255,255,255,.14)}
.stepper input{width:54px;height:38px;border:0;background:transparent;color:var(--chalk);text-align:center;font:700 18px var(--font-body);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tbtn{height:38px;padding:0 14px;border-radius:8px;border:1px solid rgba(230,237,232,.28);background:transparent;color:var(--chalk);font:500 15px var(--font-body);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn[aria-pressed="true"]{background:rgba(227,167,47,.15);border-color:var(--brass);color:var(--brass)}
.tbtn[aria-pressed="false"]{color:var(--muted)}

main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,7),var(--cell,80px));grid-auto-rows:var(--cell,80px);gap:var(--gap,10px);place-content:center;padding:clamp(14px,2.4vh,30px) 18px}

.cell{position:relative;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.face{
  position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle closest-side,var(--paper) 0 47%,var(--red) 47% 60%,var(--paper) 60% 73%,var(--red) 73% 86%,var(--paper) 86% 94%,var(--ink) 94% 100%);
  box-shadow:0 calc(var(--cell)*.05) 0 rgba(0,0,0,.35);
  transition:transform .15s,opacity .3s,filter .3s;
}
.cell:hover .face{transform:translateY(-2px)}
.num{font-family:var(--font-display);font-size:calc(var(--cell)*.33);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;position:relative}
.badge{position:absolute;right:-6%;top:-6%;display:none;padding:.18em .5em;border-radius:999px;background:var(--brass);color:var(--ink);font-weight:900;font-size:max(11px,calc(var(--cell)*.13));line-height:1.2;white-space:nowrap;z-index:2}

.cell.picked .face{filter:grayscale(.85) brightness(.62)}
.cell.picked.out .face{opacity:.4}
.cell.picked .face::before{content:"";position:absolute;width:20%;height:20%;left:60%;top:16%;border-radius:50%;background:radial-gradient(circle,#050505 0 42%,#4a3520 44% 62%,transparent 66%)}
.cell.picked .badge{display:block}
.cell.absent .face{opacity:.16;filter:grayscale(1)}
.cell.absent .badge{display:block;background:#5d6b65;color:var(--chalk)}
.cell.last .face,.cell.last.picked.out .face{filter:none;opacity:1;box-shadow:0 0 0 calc(var(--cell)*.06) var(--brass),0 0 calc(var(--cell)*.4) rgba(227,167,47,.55)}
.cell.aim::after{
  content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;
  border:calc(var(--cell)*.04) solid var(--brass);
  background:
    linear-gradient(var(--brass),var(--brass)) center top/ calc(var(--cell)*.04) 24% no-repeat,
    linear-gradient(var(--brass),var(--brass)) center bottom/ calc(var(--cell)*.04) 24% no-repeat,
    linear-gradient(var(--brass),var(--brass)) left center/ 24% calc(var(--cell)*.04) no-repeat,
    linear-gradient(var(--brass),var(--brass)) right center/ 24% calc(var(--cell)*.04) no-repeat;
}
.cell.hit .face{animation:hit .55s ease-out}
@keyframes hit{0%{transform:scale(1)}18%{transform:scale(1.2) rotate(-7deg)}45%{transform:scale(.9) rotate(5deg)}100%{transform:scale(1)}}

.battery{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px 28px;padding:0 28px 14px}
.hint{justify-self:end;align-self:center;max-width:24em;text-align:right;color:var(--muted);font-size:clamp(13px,1.15vw,16px);line-height:1.6}
.hint kbd{display:inline-block;padding:0 .45em;border:1px solid rgba(230,237,232,.35);border-bottom-width:3px;border-radius:5px;font:700 .9em var(--font-body);color:var(--chalk)}
.cannon{display:block;height:clamp(120px,22vh,270px);aspect-ratio:200/160;overflow:visible}
.fire{justify-self:start;align-self:center;font-family:var(--font-display);font-size:clamp(28px,3.4vw,52px);padding:.32em 1.1em;border:0;border-radius:14px;background:var(--brass);color:var(--ink);box-shadow:0 6px 0 var(--brass-deep);cursor:pointer;white-space:nowrap}
.fire:hover{filter:brightness(1.06)}
.fire:active{transform:translateY(4px);box-shadow:0 2px 0 var(--brass-deep)}
.fire:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 6px 0 var(--brass-deep)}
.fire.small{font-size:clamp(20px,2vw,30px)}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,22,17,.84)}
.result[hidden]{display:none}
.result .inner{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.result .label{font-family:var(--font-display);color:var(--brass);font-size:clamp(30px,6vmin,72px);letter-spacing:.04em}
.result .big{font-family:var(--font-display);font-size:clamp(140px,46vmin,560px);line-height:.95;color:var(--paper);font-variant-numeric:tabular-nums;text-shadow:0 .04em 0 var(--red)}
.result .big small{font-size:.32em;margin-left:.06em;color:var(--brass);text-shadow:none}
.result .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:4vmin}
.result .tbtn{height:auto;padding:.5em 1.2em;font-size:clamp(17px,2.2vmin,24px)}

@media (orientation:portrait){
  .bar{padding:12px 16px}
  .controls{margin-left:0;width:100%}
  .battery{grid-template-columns:1fr;justify-items:center;gap:12px;padding:0 16px 22px}
  .cannon{order:1;height:clamp(110px,15vh,250px)}
  .fire{order:2;justify-self:center;width:min(100%,600px);font-size:clamp(30px,6vw,64px)}
  .hint{order:3;justify-self:center;text-align:center;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  .cell.hit .face,.result .inner{animation:none}
  .face{transition:none}
}
</style>
</head>
<body>
<header class="bar">
  <h1>대포 뽑기</h1>
  <div class="count" id="count">남은 번호 <b>0</b> / 0</div>
  <div class="controls">
    <div class="field">
      <label for="n">인원</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="한 명 줄이기">−</button>
        <input id="n" type="number" min="2" max="60" inputmode="numeric">
        <button type="button" id="plus" aria-label="한 명 늘리기">+</button>
      </div>
    </div>
    <button type="button" class="tbtn" id="optExclude" aria-pressed="true">뽑힌 번호 빼기</button>
    <button type="button" class="tbtn" id="optSound" aria-pressed="true">소리 켜짐</button>
    <button type="button" class="tbtn" id="reset">처음부터</button>
    <button type="button" class="tbtn" id="full">전체 화면</button>
  </div>
</header>

<main id="stage">
  <div class="board" id="board" aria-label="번호 과녁판"></div>
  <div class="battery">
    <p class="hint" id="hint">결석한 번호는 과녁을 눌러 빼 두세요.<br><kbd>스페이스</kbd> 키로도 쏠 수 있어요.</p>
    <svg class="cannon" id="cannon" viewBox="0 0 200 160" aria-hidden="true">
      <ellipse cx="100" cy="154" rx="70" ry="6" fill="#000" opacity=".35"/>
      <g id="barrel">
        <rect x="82" y="20" width="36" height="98" rx="9" fill="#2a3035"/>
        <rect x="90" y="30" width="6" height="80" rx="3" fill="#fff" opacity=".13"/>
        <rect x="80" y="62" width="40" height="8" rx="2" fill="#e3a72f"/>
        <rect x="77" y="13" width="46" height="15" rx="5" fill="#e3a72f"/>
        <rect x="86" y="13" width="28" height="5" rx="2" fill="#0b0d0e"/>
      </g>
      <path d="M48 150 L72 104 L128 104 L152 150 Z" fill="#6e4123"/>
      <path d="M72 104 L128 104 L124 112 L76 112 Z" fill="#8a5630"/>
      <circle cx="100" cy="124" r="27" fill="none" stroke="#3f2412" stroke-width="8"/>
      <g stroke="#3f2412" stroke-width="4">
        <line x1="100" y1="97" x2="100" y2="151"/>
        <line x1="73" y1="124" x2="127" y2="124"/>
        <line x1="81" y1="105" x2="119" y2="143"/>
        <line x1="119" y1="105" x2="81" y2="143"/>
      </g>
      <circle cx="100" cy="124" r="8" fill="#e3a72f"/>
    </svg>
    <button type="button" class="fire" id="fire">발사!</button>
  </div>
  <canvas id="fx"></canvas>
</main>

<div class="result" id="result" hidden role="dialog" aria-modal="true" aria-labelledby="resNum">
  <div class="inner">
    <div class="label">명중!</div>
    <div class="big" id="resNum">7<small>번</small></div>
    <div class="actions">
      <button type="button" class="tbtn fire small" id="again">한 번 더 발사</button>
      <button type="button" class="tbtn" id="close">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const KEY = "cannon-draw-v1";
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  let S = {n:28, exclude:true, sound:true, picks:[], absent:[]};
  try{
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved && typeof saved.n === "number") S = Object.assign(S, saved);
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  const $ = id => document.getElementById(id);
  const board = $("board"), stage = $("stage"), canvas = $("fx"), ctx = canvas.getContext("2d");
  const cannon = $("cannon"), barrel = $("barrel"), fireBtn = $("fire"), nInput = $("n");
  const result = $("result");
  let cells = [], busy = false, lastPick = null;

  /* ---------- 상태 ---------- */
  function available(){
    const out = [];
    for(let i=1;i<=S.n;i++){
      if(S.absent.includes(i)) continue;
      if(S.exclude && S.picks.includes(i)) continue;
      out.push(i);
    }
    return out;
  }
  function present(){ let c=0; for(let i=1;i<=S.n;i++) if(!S.absent.includes(i)) c++; return c; }

  function build(){
    board.innerHTML = "";
    cells = [];
    for(let i=1;i<=S.n;i++){
      const b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.dataset.n = i;
      b.innerHTML = '<span class="face"><span class="num">'+i+'</span></span><span class="badge"></span>';
      b.addEventListener("click", () => toggleCell(i));
      board.appendChild(b);
      cells[i] = b;
    }
    refresh();
    layout();
  }

  function refresh(){
    for(let i=1;i<=S.n;i++){
      const c = cells[i]; if(!c) continue;
      const order = S.picks.lastIndexOf(i);
      const picked = order !== -1, absent = S.absent.includes(i);
      c.classList.toggle("picked", picked && !absent);
      c.classList.toggle("out", picked && S.exclude);
      c.classList.toggle("absent", absent);
      c.classList.toggle("last", i === lastPick && !absent);
      const badge = c.querySelector(".badge");
      badge.textContent = absent ? "결석" : (picked ? (order+1)+"번째" : "");
      c.setAttribute("aria-label", i+"번" + (absent ? ", 결석" : picked ? ", "+(order+1)+"번째로 뽑힘" : ""));
    }
    const av = available().length;
    $("count").innerHTML = "남은 번호 <b>"+av+"</b> / "+present();
    fireBtn.disabled = busy || av === 0;
    fireBtn.textContent = av === 0 ? "남은 번호 없음" : "발사!";
    $("hint").innerHTML = av === 0
      ? "모두 뽑혔어요.<br><b>처음부터</b>를 누르면 다시 시작해요."
      : "결석한 번호는 과녁을 눌러 빼 두세요.<br><kbd>스페이스</kbd> 키로도 쏠 수 있어요.";
    nInput.value = S.n;
    setPressed($("optExclude"), S.exclude, "뽑힌 번호 빼기", "뽑힌 번호 다시 넣기");
    setPressed($("optSound"), S.sound, "소리 켜짐", "소리 꺼짐");
  }
  function setPressed(btn, on, onText, offText){
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? onText : offText;
  }

  function toggleCell(i){
    if(busy) return;
    if(S.picks.includes(i)){
      S.picks = S.picks.filter(x => x !== i);
      if(lastPick === i) lastPick = null;
    }else if(S.absent.includes(i)){
      S.absent = S.absent.filter(x => x !== i);
    }else{
      S.absent.push(i);
    }
    save(); refresh();
  }

  function setN(v){
    v = Math.max(2, Math.min(60, Math.round(Number(v) || S.n)));
    S.n = v;
    S.picks = S.picks.filter(x => x <= v);
    S.absent = S.absent.filter(x => x <= v);
    if(lastPick > v) lastPick = null;
    save(); build();
  }

  /* ---------- 배치 ---------- */
  function layout(){
    const cs = getComputedStyle(board);
    const W = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let best = {s:0, c:1};
    for(let c=1;c<=S.n;c++){
      const r = Math.ceil(S.n / c);
      const gap = Math.max(8, Math.min(W, H) * 0.018);
      const s = Math.min((W - gap*(c-1)) / c, (H - gap*(r-1)) / r);
      if(s > best.s) best = {s, c, gap};
    }
    const size = Math.max(24, Math.floor(best.s * 0.92));
    board.style.setProperty("--cols", best.c);
    board.style.setProperty("--cell", size + "px");
    board.style.setProperty("--gap", Math.floor(best.gap + best.s*0.08) + "px");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = stage.clientWidth * dpr;
    canvas.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  /* ---------- 소리 ---------- */
  let ac = null, noiseBuf = null;
  function ensureAudio(){
    if(!ac){
      try{
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
      }catch(e){ ac = null; }
    }
    if(ac && ac.state === "suspended") ac.resume().catch(()=>{});
  }
  function env(g, t, peak, dur){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function noise(dur, f0, f1, peak){
    const t = ac.currentTime, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = "lowpass";
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, peak, dur);
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t); src.stop(t + dur + 0.05);
  }
  function tone(type, f0, f1, peak, dur, delay){
    const t = ac.currentTime + (delay||0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, peak, dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    tick(){ tone("square", 1500, 1100, 0.05, 0.04); },
    boom(){ noise(0.8, 1200, 120, 0.9); tone("sine", 110, 38, 0.8, 0.45); },
    whistle(d){ tone("sine", 1700, 520, 0.045, d); },
    blast(){ noise(1.2, 2200, 160, 1.0); tone("sine", 80, 30, 0.7, 0.6); },
    fanfare(){
      [523.25, 659.25, 783.99].forEach((f,i) => tone("triangle", f, f, 0.16, 0.16, i*0.12));
      tone("triangle", 1046.5, 1046.5, 0.18, 0.6, 0.36);
      tone("triangle", 783.99, 783.99, 0.1, 0.6, 0.36);
    }
  };
  function play(name, arg){ if(!S.sound || !ac) return; try{ sfx[name](arg); }catch(e){} }

  /* ---------- 대포와 효과 ---------- */
  let angle = 0, targetAngle = 0, recoil = 0, ball = null, parts = [], flash = null;

  function stageRect(){ return stage.getBoundingClientRect(); }
  function pivot(){
    const r = cannon.getBoundingClientRect(), s = stageRect(), k = r.width / 200;
    return {x: r.left - s.left + 100*k, y: r.top - s.top + 112*k, k};
  }
  function centerOf(i){
    const r = cells[i].getBoundingClientRect(), s = stageRect();
    return {x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2, w: r.width};
  }
  function aimAt(i){
    cells.forEach(c => c && c.classList.remove("aim"));
    if(i == null) return;
    cells[i].classList.add("aim");
    const p = pivot(), t = centerOf(i);
    targetAngle = Math.max(-82, Math.min(82, Math.atan2(t.x - p.x, p.y - t.y) * 180 / Math.PI));
  }
  function muzzle(){
    const p = pivot(), a = angle * Math.PI / 180, L = 98 * p.k;
    return {x: p.x + Math.sin(a)*L, y: p.y - Math.cos(a)*L, k: p.k, a};
  }

  function puff(x, y, n, opt){
    for(let i=0;i<n;i++){
      const a = (opt.dir ?? Math.random()*Math.PI*2) + (Math.random()-.5)*(opt.spread ?? Math.PI*2);
      const sp = opt.speed * (0.4 + Math.random()*0.8);
      parts.push({x, y, vx: Math.sin(a)*sp, vy: -Math.cos(a)*sp, life:0, max: opt.life*(0.6+Math.random()*0.6),
        r: opt.r*(0.6+Math.random()*0.8), kind: opt.kind, color: opt.colors[i % opt.colors.length], drag: opt.drag ?? 0.92, grav: opt.grav ?? 0});
    }
  }

  let lastT = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
    angle += (targetAngle - angle) * (1 - Math.pow(0.0005, dt));
    recoil *= Math.pow(0.004, dt);
    barrel.setAttribute("transform", "rotate("+angle.toFixed(2)+" 100 112) translate(0 "+recoil.toFixed(2)+")");

    const w = stage.clientWidth, h = stage.clientHeight;
    ctx.clearRect(0, 0, w, h);

    if(flash){
      flash.life += dt;
      const t = flash.life / flash.max;
      if(t >= 1) flash = null;
      else{
        ctx.globalAlpha = (1 - t) * 0.9;
        ctx.fillStyle = "#fff6d8";
        ctx.beginPath(); ctx.arc(flash.x, flash.y, flash.r * (0.6 + t*1.6), 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = (1 - t);
        ctx.strokeStyle = "#e3a72f"; ctx.lineWidth = Math.max(2, flash.r*0.08*(1-t));
        ctx.beginPath(); ctx.arc(flash.x, flash.y, flash.r * (0.8 + t*2.4), 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    for(let i=parts.length-1;i>=0;i--){
      const p = parts[i];
      p.life += dt;
      if(p.life >= p.max){ parts.splice(i,1); continue; }
      const k = Math.pow(p.drag, dt*60);
      p.vx *= k; p.vy = p.vy*k + p.grav*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      const t = p.life / p.max;
      if(p.kind === "smoke"){
        ctx.globalAlpha = 0.45 * (1 - t);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1 + t*1.8), 0, Math.PI*2); ctx.fill();
      }else if(p.kind === "spark"){
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = p.color; ctx.lineWidth = p.r*(1-t*0.6); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*0.04, p.y - p.vy*0.04); ctx.stroke();
      }else{
        ctx.globalAlpha = 1 - t*t;
        ctx.fillStyle = p.color;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life*8 + p.r);
        ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    if(ball){
      const t = Math.min(1, (now - ball.t0) / ball.dur);
      const u = 1 - t;
      const x = u*u*ball.p0.x + 2*u*t*ball.p1.x + t*t*ball.p2.x;
      const y = u*u*ball.p0.y + 2*u*t*ball.p1.y + t*t*ball.p2.y;
      const r = ball.r0 * (1 - 0.55*t);
      if(Math.random() < 0.7) parts.push({x, y, vx:(Math.random()-.5)*20, vy:(Math.random()-.5)*20, life:0, max:0.5, r:r*0.7, kind:"smoke", color:"#c9cfc9", drag:0.9, grav:0});
      const g = ctx.createRadialGradient(x - r*0.35, y - r*0.35, r*0.1, x, y, r);
      g.addColorStop(0, "#7c868c"); g.addColorStop(0.5, "#2c3236"); g.addColorStop(1, "#0b0d0e");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      if(t >= 1){ const done = ball.done; ball = null; done(); }
    }
    requestAnimationFrame(frame);
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function fire(){
    if(busy) return;
    const av = available();
    if(!av.length) return;
    ensureAudio();
    busy = true; refresh();
    if(lastPick != null){ lastPick = null; refresh(); }

    const winner = av[Math.floor(Math.random() * av.length)];
    const pool = av.length > 1 ? av : (function(){ const a=[]; for(let i=1;i<=S.n;i++) if(!S.absent.includes(i)) a.push(i); return a; })();

    if(!reduceMotion && pool.length > 1){
      let d = 70, prev = null;
      while(d < 420){
        let pick;
        do{ pick = pool[Math.floor(Math.random()*pool.length)]; }while(pick === prev && pool.length > 1);
        prev = pick; aimAt(pick); play("tick");
        await sleep(d); d *= 1.2;
      }
    }
    aimAt(winner); play("tick");
    await sleep(reduceMotion ? 150 : 650);

    const m = muzzle(), t = centerOf(winner);
    recoil = 16;
    play("boom");
    puff(m.x, m.y, 14, {dir:m.a, spread:1.4, speed:260*m.k+60, life:0.9, r:14*m.k+4, kind:"smoke", colors:["#d8ddd8","#b7bfb9","#eef0ea"]});
    puff(m.x, m.y, 12, {dir:m.a, spread:0.9, speed:520*m.k+120, life:0.35, r:3, kind:"spark", colors:["#ffd36b","#ff9a3c"]});

    const dist = Math.hypot(t.x - m.x, t.y - m.y);
    const dur = reduceMotion ? 350 : Math.max(500, Math.min(950, dist * 1.4));
    play("whistle", dur/1000);
    await new Promise(done => {
      ball = {t0: performance.now(), dur, done, r0: 17*m.k + 2,
        p0:{x:m.x, y:m.y}, p2:{x:t.x, y:t.y},
        p1:{x:(m.x + t.x)/2, y: Math.min(m.y, t.y) - dist*0.28}};
    });

    play("blast");
    flash = {x:t.x, y:t.y, r:t.w*0.55, life:0, max:0.45};
    puff(t.x, t.y, 34, {speed:t.w*6, life:0.7, r:Math.max(2, t.w*0.035), kind:"spark", colors:["#ffd36b","#ff9a3c","#f4ecd9","#e3a72f"], drag:0.9, grav:200});
    puff(t.x, t.y, 30, {speed:t.w*4.5, life:1.6, r:Math.max(3, t.w*0.06), kind:"confetti", colors:["#c73a2b","#f4ecd9","#e3a72f","#6fbf8e"], drag:0.93, grav:420});
    puff(t.x, t.y, 10, {speed:t.w*1.2, life:1.1, r:t.w*0.18, kind:"smoke", colors:["#6d756f","#8d958f"], drag:0.9});

    aimAt(null);
    S.picks.push(winner);
    lastPick = winner;
    save(); refresh();
    const c = cells[winner];
    c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit");

    await sleep(reduceMotion ? 200 : 650);
    showResult(winner);
    busy = false; refresh();
  }

  function showResult(n){
    $("resNum").innerHTML = n + "<small>번</small>";
    $("again").hidden = available().length === 0;
    result.hidden = false;
    play("fanfare");
    $("close").focus();
  }
  function closeResult(){ result.hidden = true; fireBtn.focus(); }

  /* ---------- 이벤트 ---------- */
  fireBtn.addEventListener("click", fire);
  $("again").addEventListener("click", () => { closeResult(); fire(); });
  $("close").addEventListener("click", closeResult);
  result.addEventListener("click", e => { if(e.target === result) closeResult(); });
  $("minus").addEventListener("click", () => { if(!busy) setN(S.n - 1); });
  $("plus").addEventListener("click", () => { if(!busy) setN(S.n + 1); });
  nInput.addEventListener("change", () => { if(!busy) setN(nInput.value); else nInput.value = S.n; });
  $("optExclude").addEventListener("click", () => { S.exclude = !S.exclude; save(); refresh(); });
  $("optSound").addEventListener("click", () => { S.sound = !S.sound; if(S.sound) ensureAudio(); save(); refresh(); });
  $("reset").addEventListener("click", () => { if(busy) return; S.picks = []; lastPick = null; save(); refresh(); });

  const fullBtn = $("full");
  if(!document.fullscreenEnabled) fullBtn.hidden = true;
  fullBtn.addEventListener("click", () => {
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else document.documentElement.requestFullscreen().catch(() => { fullBtn.hidden = true; });
  });
  document.addEventListener("fullscreenchange", () => {
    fullBtn.textContent = document.fullscreenElement ? "전체 화면 끝내기" : "전체 화면";
  });

  document.addEventListener("keydown", e => {
    if(e.target && e.target.tagName === "INPUT") return;
    if(e.code === "Space"){
      e.preventDefault();
      if(!result.hidden){ closeResult(); }
      fire();
    }else if(e.key === "Escape" && !result.hidden){
      closeResult();
    }
  });

  let rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  build();
  requestAnimationFrame(frame);
})();
</script>
