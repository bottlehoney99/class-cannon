<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 명 뽑기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 탭마다 색 세계를 따로 둔다. 기본값은 대포(사격장 녹색 펠트). 위는 설정 줄, 가운데 무대, 아래 뽑기 버튼 줄. */
  --bg:#0c231b; --panel:#18402f; --fg:#e6ede8; --muted:#9fb5ab; --accent:#e3a72f; --btn:#e3a72f; --btn-ink:#1c1a17; --btn-deep:#9c6b17;
  --font-display:"Black Han Sans","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
body[data-mode="claw"]{--bg:#1d2440;--panel:#2a3359;--fg:#eef0fa;--muted:#9aa3c7;--accent:#ff6f91;--btn:#ff6f91;--btn-ink:#1d1424;--btn-deep:#a8334f}
body[data-mode="gacha"]{--bg:#cfe6dc;--panel:#b9d8cb;--fg:#1f2a27;--muted:#4f6a61;--accent:#d8342c;--btn:#d8342c;--btn-ink:#fff;--btn-deep:#8f1d17;color-scheme:light}
body[data-mode="fish"]{--bg:#0b3442;--panel:#0f4556;--fg:#e3f4f2;--muted:#86b3b5;--accent:#ffb347;--btn:#ffb347;--btn-ink:#1b1b1b;--btn-deep:#b56e17}
body[data-mode="slot"]{--bg:#2a0f14;--panel:#3d161d;--fg:#f7e7c4;--muted:#b98f86;--accent:#f2b632;--btn:#f2b632;--btn-ink:#2a0f14;--btn-deep:#9a6c10}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px;border-bottom:1px solid color-mix(in srgb,var(--fg) 18%,transparent)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.tab{border:0;background:transparent;color:var(--muted);font:700 16px var(--font-body);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.tab small{font-weight:500;opacity:.7;margin-right:4px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-left:auto}
.field{display:flex;align-items:center;gap:8px;font-size:15px}
.stepper{display:flex;align-items:center;border:1px solid color-mix(in srgb,var(--fg) 28%,transparent);border-radius:8px;overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg);font-size:19px;cursor:pointer}
.stepper input{width:50px;height:36px;border:0;background:transparent;color:var(--fg);text-align:center;font:700 17px var(--font-body);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tbtn{height:36px;padding:0 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--fg) 28%,transparent);background:transparent;color:var(--fg);font:500 15px var(--font-body);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tbtn[aria-pressed="false"]{color:var(--muted)}

main{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* 대포: 과녁판 */
body[data-mode="cannon"]{background-image:radial-gradient(ellipse at 50% 30%,#18402f 0%,#0c231b 78%)}
#targets{position:absolute;inset:0;display:none;grid-template-columns:repeat(var(--cols,7),var(--cell,80px));grid-auto-rows:var(--cell,80px);gap:var(--gap,10px);place-content:center;padding:16px 18px calc(var(--ch,180px) + 18px)}
body[data-mode="cannon"] #targets{display:grid}
#cannonSvg{position:absolute;left:50%;bottom:6px;height:var(--ch,180px);aspect-ratio:200/160;transform:translateX(-50%);overflow:visible;display:none;z-index:1}
body[data-mode="cannon"] #cannonSvg{display:block}
.cell{position:relative;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle closest-side,#f4ecd9 0 47%,#c73a2b 47% 60%,#f4ecd9 60% 73%,#c73a2b 73% 86%,#f4ecd9 86% 94%,#1c1a17 94% 100%);
  box-shadow:0 calc(var(--cell)*.05) 0 rgba(0,0,0,.35);transition:transform .15s,opacity .3s,filter .3s}
.cell:hover .face{transform:translateY(-2px)}
.num{font-family:var(--font-display);font-size:calc(var(--cell)*.33);line-height:1;color:#1c1a17;font-variant-numeric:tabular-nums;position:relative}
.badge{position:absolute;right:-6%;top:-6%;display:none;padding:.18em .5em;border-radius:999px;background:var(--accent);color:#1c1a17;font-weight:900;font-size:max(11px,calc(var(--cell)*.13));line-height:1.2;white-space:nowrap;z-index:2}
.cell.picked .face{filter:grayscale(.85) brightness(.62)}
.cell.picked.out .face{opacity:.4}
.cell.picked .face::before{content:"";position:absolute;width:20%;height:20%;left:60%;top:16%;border-radius:50%;background:radial-gradient(circle,#050505 0 42%,#4a3520 44% 62%,transparent 66%)}
.cell.picked .badge{display:block}
.cell.absent .face{opacity:.16;filter:grayscale(1)}
.cell.absent .badge{display:block;background:#5d6b65;color:#e6ede8}
.cell.last .face,.cell.last.picked.out .face{filter:none;opacity:1;box-shadow:0 0 0 calc(var(--cell)*.06) var(--accent),0 0 calc(var(--cell)*.4) rgba(227,167,47,.55)}
.cell.aim::after{content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;border:calc(var(--cell)*.04) solid var(--accent);
  background:linear-gradient(var(--accent),var(--accent)) center top/calc(var(--cell)*.04) 24% no-repeat,linear-gradient(var(--accent),var(--accent)) center bottom/calc(var(--cell)*.04) 24% no-repeat,linear-gradient(var(--accent),var(--accent)) left center/24% calc(var(--cell)*.04) no-repeat,linear-gradient(var(--accent),var(--accent)) right center/24% calc(var(--cell)*.04) no-repeat}
.cell.hit .face{animation:hit .55s ease-out}
@keyframes hit{0%{transform:scale(1)}18%{transform:scale(1.2) rotate(-7deg)}45%{transform:scale(.9) rotate(5deg)}100%{transform:scale(1)}}

/* 슬롯머신 */
#slot{position:absolute;inset:0;display:none;place-items:center}
body[data-mode="slot"] #slot{display:grid}
.machine{position:relative;display:flex;align-items:center;gap:calc(var(--rh)*.25)}
.cabinet{position:relative;padding:calc(var(--rh)*.22);border-radius:calc(var(--rh)*.22);background:linear-gradient(#7a1f2b,#4b1119);box-shadow:0 0 0 4px #1a070a,0 18px 40px rgba(0,0,0,.5)}
.bulbs{position:absolute;inset:calc(var(--rh)*.07);border-radius:calc(var(--rh)*.17);pointer-events:none;
  background:
   radial-gradient(circle,var(--accent) 0 30%,transparent 34%) 0 0/ calc(var(--rh)*.2) calc(var(--rh)*.2) repeat-x,
   radial-gradient(circle,var(--accent) 0 30%,transparent 34%) 0 100%/ calc(var(--rh)*.2) calc(var(--rh)*.2) repeat-x;
  opacity:.85}
.machine.spinning .bulbs{animation:blink .24s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.window{position:relative;width:calc(var(--rh)*2.3);height:calc(var(--rh)*3);overflow:hidden;border-radius:calc(var(--rh)*.1);background:#fbf3df;box-shadow:inset 0 0 0 3px #1a070a}
.window::before,.window::after{content:"";position:absolute;left:0;right:0;height:calc(var(--rh)*.9);z-index:2;pointer-events:none}
.window::before{top:0;background:linear-gradient(rgba(42,15,20,.75),rgba(42,15,20,0))}
.window::after{bottom:0;background:linear-gradient(rgba(42,15,20,0),rgba(42,15,20,.75))}
.payline{position:absolute;left:-6px;right:-6px;top:50%;height:var(--rh);transform:translateY(-50%);border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);z-index:3;pointer-events:none}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.row{height:var(--rh);display:grid;place-items:center;font-family:var(--font-display);font-size:calc(var(--rh)*.74);color:#2a0f14;font-variant-numeric:tabular-nums;line-height:1}
.row.win{color:#b3121f}
.lever{position:relative;width:calc(var(--rh)*.36);height:calc(var(--rh)*2.2)}
.lever .rod{position:absolute;left:50%;bottom:0;width:calc(var(--rh)*.09);height:100%;margin-left:calc(var(--rh)*-.045);background:linear-gradient(90deg,#9aa2a8,#e8ecee,#9aa2a8);border-radius:99px;transform-origin:50% 100%;transition:transform .25s}
.lever .knob{position:absolute;left:50%;top:calc(var(--rh)*-.18);width:calc(var(--rh)*.36);height:calc(var(--rh)*.36);margin-left:calc(var(--rh)*-.18);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b6b,#c4161c 60%,#7d0b10)}
.lever .base{position:absolute;left:0;right:0;bottom:calc(var(--rh)*-.12);height:calc(var(--rh)*.24);border-radius:8px;background:#1a070a}
.machine.pulled .rod{transform:scaleY(-.55)}

.foot{flex:none;display:flex;align-items:center;gap:14px 24px;padding:12px 22px 16px;flex-wrap:wrap}
.go{font-family:var(--font-display);font-size:clamp(26px,3vw,46px);padding:.28em 1.2em;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 0 var(--btn-deep);cursor:pointer;white-space:nowrap}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-deep)}
.go:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 6px 0 var(--btn-deep)}
.history{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px;color:var(--muted);min-width:0}
.history b{display:inline-grid;place-items:center;min-width:2em;height:2em;padding:0 .4em;border-radius:99px;background:var(--panel);color:var(--fg);font-variant-numeric:tabular-nums}
.about{margin-left:auto;max-width:30em;font-size:14px;line-height:1.55;color:var(--muted)}

.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 86%,transparent)}
.result[hidden]{display:none}
.result .inner{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.result .label{font-family:var(--font-display);color:var(--accent);font-size:clamp(30px,6vmin,72px)}
.result .big{font-family:var(--font-display);font-size:clamp(140px,46vmin,560px);line-height:.95;color:var(--fg);font-variant-numeric:tabular-nums}
.result .big small{font-size:.32em;color:var(--accent)}
.result .actions{display:flex;gap:14px;justify-content:center;margin-top:4vmin}
.result .tbtn{height:auto;padding:.5em 1.2em;font-size:clamp(17px,2.2vmin,24px)}

@media (orientation:portrait){
  .controls{margin-left:0}
  .foot{flex-direction:column;align-items:stretch;padding:12px 16px 22px}
  .go{font-size:clamp(30px,6vw,64px)}
  .history{justify-content:center}
  .about{margin:0;max-width:none;text-align:center}
}
@media (prefers-reduced-motion:reduce){.result .inner{animation:none}.machine.spinning .bulbs{animation:none}}
</style>
</head>
<body data-mode="cannon">
<header class="bar">
  <div class="tabs" role="tablist" aria-label="뽑기 방식">
    <button class="tab" role="tab" data-mode="cannon" aria-selected="true">대포</button>
    <button class="tab" role="tab" data-mode="claw" aria-selected="false">인형뽑기</button>
    <button class="tab" role="tab" data-mode="gacha" aria-selected="false">캡슐 뽑기</button>
    <button class="tab" role="tab" data-mode="fish" aria-selected="false">낚시</button>
    <button class="tab" role="tab" data-mode="slot" aria-selected="false">슬롯머신</button>
  </div>
  <div class="controls">
    <div class="field">
      <label for="n">인원</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="한 명 줄이기">−</button>
        <input id="n" type="number" min="2" max="60" inputmode="numeric">
        <button type="button" id="plus" aria-label="한 명 늘리기">+</button>
      </div>
    </div>
    <button type="button" class="tbtn" id="optExclude" aria-pressed="true">뽑힌 번호 빼기</button>
    <button type="button" class="tbtn" id="optSound" aria-pressed="true">소리 켜짐</button>
    <button type="button" class="tbtn" id="reset">처음부터</button>
  </div>
</header>

<main id="stage">
  <div id="targets" aria-label="번호 과녁판"></div>
  <svg id="cannonSvg" viewBox="0 0 200 160" aria-hidden="true">
    <ellipse cx="100" cy="154" rx="70" ry="6" fill="#000" opacity=".35"/>
    <g id="barrel">
      <rect x="82" y="20" width="36" height="98" rx="9" fill="#2a3035"/>
      <rect x="90" y="30" width="6" height="80" rx="3" fill="#fff" opacity=".13"/>
      <rect x="80" y="62" width="40" height="8" rx="2" fill="#e3a72f"/>
      <rect x="77" y="13" width="46" height="15" rx="5" fill="#e3a72f"/>
      <rect x="86" y="13" width="28" height="5" rx="2" fill="#0b0d0e"/>
    </g>
    <path d="M48 150 L72 104 L128 104 L152 150 Z" fill="#6e4123"/>
    <path d="M72 104 L128 104 L124 112 L76 112 Z" fill="#8a5630"/>
    <circle cx="100" cy="124" r="27" fill="none" stroke="#3f2412" stroke-width="8"/>
    <g stroke="#3f2412" stroke-width="4"><line x1="100" y1="97" x2="100" y2="151"/><line x1="73" y1="124" x2="127" y2="124"/><line x1="81" y1="105" x2="119" y2="143"/><line x1="119" y1="105" x2="81" y2="143"/></g>
    <circle cx="100" cy="124" r="8" fill="#e3a72f"/>
  </svg>
  <div id="slot">
    <div class="machine" id="machine">
      <div class="cabinet">
        <div class="bulbs"></div>
        <div class="window"><div class="strip" id="strip"></div><div class="payline"></div></div>
      </div>
      <div class="lever" aria-hidden="true"><div class="rod"><div class="knob"></div></div><div class="base"></div></div>
    </div>
  </div>
  <canvas id="cv"></canvas>
</main>

<footer class="foot">
  <button type="button" class="go" id="go">뽑기!</button>
  <div class="history" id="history"></div>
  <p class="about" id="about"></p>
</footer>

<div class="result" id="result" hidden role="dialog" aria-modal="true" aria-labelledby="resNum">
  <div class="inner">
    <div class="label" id="resLabel">당첨!</div>
    <div class="big" id="resNum">7<small>번</small></div>
    <div class="actions">
      <button type="button" class="go" id="again" style="font-size:clamp(20px,2vw,30px)">한 번 더</button>
      <button type="button" class="tbtn" id="close">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY="draw5-v1";
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let S={mode:"cannon",n:28,exclude:true,sound:true,picks:[],absent:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s.n==="number") S=Object.assign(S,s);}catch(e){}
if(!Array.isArray(S.absent))S.absent=[];if(!["cannon","claw","gacha","fish","slot"].includes(S.mode))S.mode="cannon";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const stage=$("stage"), cv=$("cv"), ctx=cv.getContext("2d"), goBtn=$("go"), result=$("result");
let W=0,H=0,busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>a+Math.random()*(b-a);
const ease=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function available(){const o=[];for(let i=1;i<=S.n;i++){if(S.absent.includes(i))continue;if(S.exclude&&S.picks.includes(i))continue;o.push(i);}return o;}

const ABOUT={
  cannon:"대포가 과녁 사이를 조준하다가 한 곳을 쏴요. 결석한 번호는 과녁을 눌러 빼 두면 다른 탭에서도 빠져요.",
  claw:"집게가 인형 위로 가서 내려가 한 마리를 집어 올려요. 인형 배에 번호표가 붙어 있어요.",
  gacha:"손잡이를 돌리면 캡슐이 흔들리고 하나가 굴러 나와 열려요. 남은 캡슐 수가 줄어드는 게 눈에 보여요.",
  fish:"번호 물고기가 헤엄치다가 한 마리가 낚싯바늘을 물고 끌려 올라와요. 저학년이 특히 좋아할 만해요.",
  slot:"레버를 당기면 번호 릴이 돌다가 천천히 멈춰요. 마지막 몇 칸에서 긴장감이 생겨요."
};
const LABEL={cannon:"명중!",claw:"잡았다!",gacha:"나왔다!",fish:"낚았다!",slot:"당첨!"};

/* ---------- 소리 ---------- */
let ac=null,nb=null;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){ac=null;}}
  if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});
}
function env(g,t,p,d,a){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+(a||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function noise(d,f0,f1,p,type,delay,att){const t=ac.currentTime+(delay||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type=type||"lowpass";f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);env(g,t,p,d,att);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+d+.05);}
function tone(type,f0,f1,p,d,delay){const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+d);env(g,t,p,d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);}
const SFX={
  tick:()=>tone("square",1400,1000,.04,.035),
  crackle:()=>noise(.12,6000,2500,.18,"highpass"),
  thunder:()=>{noise(.18,8000,3000,.6,"highpass");noise(1.8,900,60,1,"lowpass",.05,.04);tone("sine",70,30,.6,.9,.05);},
  crank:()=>{tone("square",220,160,.06,.05);noise(.06,3000,1500,.12,"bandpass");},
  rattle:()=>noise(.08,2500,1200,.15,"bandpass"),
  pop:()=>{tone("sine",500,1100,.3,.12);noise(.08,4000,2000,.15,"highpass");},
  plop:()=>tone("sine",700,180,.35,.18),
  splash:()=>{noise(.6,3500,500,.5,"lowpass");noise(.3,7000,3000,.2,"highpass",.05);},
  lever:()=>{tone("sawtooth",160,90,.12,.18);noise(.1,2000,600,.2,"bandpass");},
  boom:()=>{noise(.8,1200,120,.9);tone("sine",110,38,.8,.45);},
  whistle:d=>tone("sine",1700,520,.045,d),
  blast:()=>{noise(1.2,2200,160,1);tone("sine",80,30,.7,.6);},
  motor:d=>{tone("sawtooth",70,74,.035,d);},
  clack:()=>{tone("square",700,220,.12,.07);noise(.05,5000,2000,.15,"highpass");},
  thud:()=>tone("sine",160,55,.4,.22),
  stop:()=>{tone("square",300,300,.12,.08);tone("square",220,220,.1,.1,.06);},
  fanfare:()=>{[523.25,659.25,783.99].forEach((f,i)=>tone("triangle",f,f,.16,.16,i*.12));tone("triangle",1046.5,1046.5,.18,.6,.36);tone("triangle",783.99,783.99,.1,.6,.36);}
};
const play=(n,a)=>{if(S.sound&&ac)try{SFX[n](a);}catch(e){}};

const cannonM=(function(){

      b.innerHTML='<span class="face"><span class="num">'+i+'</span></span><span class="badge"></span>';

    mark();layout();
  }
  function mark(){
    for(let i=1;i<=S.n;i++){const c=cells[i];if(!c)continue;const o=S.picks.lastIndexOf(i),pk=o!==-1,ab=S.absent.includes(i);
      c.classList.toggle("picked",pk&&!ab);c.classList.toggle("out",pk&&S.exclude);c.classList.toggle("absent",ab);c.classList.toggle("last",i===last&&!ab);

  function centerOf(i){const r=cells[i].getBoundingClientRect(),s=sr();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,w:r.width};}

const gacha=(function(){

    // 받침
    ctx.fillStyle="rgba(0,0,0,.15)";ctx.beginPath();ctx.ellipse(cx,G.bodyTop+G.bh+G.s*.015,G.bw*.62,G.s*.025,0,0,Math.PI*2);ctx.fill();
    // 몸통
    rr(cx-G.bw/2,G.bodyTop,G.bw,G.bh,G.s*.03);ctx.fillStyle="#d8342c";ctx.fill();
    rr(cx-G.bw/2,G.bodyTop,G.bw,G.bh*.16,G.s*.03);ctx.fillStyle="#b2241d";ctx.fill();
    // 배출구
    rr(G.out.x-G.out.w/2,G.out.y-G.out.h/2,G.out.w,G.out.h,G.out.h*.25);ctx.fillStyle="#3b0d0a";ctx.fill();
    // 손잡이
    ctx.beginPath();ctx.arc(G.knob.x,G.knob.y,G.knob.r,0,Math.PI*2);ctx.fillStyle="#e9edef";ctx.fill();ctx.lineWidth=G.s*.006;ctx.strokeStyle="#8d969b";ctx.stroke();
    ctx.save();ctx.translate(G.knob.x,G.knob.y);ctx.rotate(knob);rr(-G.knob.r*1.15,-G.knob.r*.2,G.knob.r*2.3,G.knob.r*.4,G.knob.r*.2);ctx.fillStyle="#8d969b";ctx.fill();ctx.restore();
    // 유리 돔 뒤판
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,.35)";ctx.fill();
    const r=capR();
    caps.forEach(c=>capsule(c.x,c.y,r,c.c,c.rot,0));
    // 유리 반사와 테두리
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.lineWidth=G.s*.012;ctx.strokeStyle="#1f2a27";ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,R*.82,Math.PI*1.1,Math.PI*1.45);ctx.lineWidth=G.s*.014;ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineCap="round";ctx.stroke();
    // 뚜껑
    rr(cx-R*.35,cy-R-G.s*.03,R*.7,G.s*.04,G.s*.01);ctx.fillStyle="#b2241d";ctx.fill();
    ctx.restore();
    if(show){const s=show;s.t+=dt;
      let x,y,rad,open=0;
      if(s.t<.45){const k=ease(s.t/.45);x=G.out.x+k*G.out.w*.1;y=G.out.y+k*G.out.h*.9;rad=r*(.6+.4*k);}
      else if(s.t<1.05){const k=easeIO((s.t-.45)/.6);x=G.out.x+(W/2-G.out.x)*k;y=G.out.y+G.out.h*.9+(H*.46-G.out.y-G.out.h*.9)*k;rad=r+(Math.min(W,H)*.2-r)*k;s.rot=(1-k)*4;}
      else{x=W/2;y=H*.46;rad=Math.min(W,H)*.2;open=Math.min(1,ease((s.t-1.05)/.35));if(!s.popped){s.popped=1;play("pop");burst(x,y,40,{speed:rad*5,life:1.5,r:Math.max(3,rad*.05),kind:"confetti",colors:CONFETTI,grav:500});}}
      if(s.t>.45){ctx.fillStyle="rgba(207,230,220,"+Math.min(.94,(s.t-.45)*1.8)+")";ctx.fillRect(0,0,W,H);}
      capsule(x,y,rad,s.c,s.rot||0,open,s.num);
    }
    drawParts(dt);
  }
  async function draw(win){
    audio();
    for(let k=0;k<(RM?2:8);k++){knob+=Math.PI/4;play("crank");shake=.15;caps.forEach(c=>{c.vx+=rand(-1,1)*G.s*.9;c.vy-=rand(.3,1)*G.s*1.3;});if(k%2)play("rattle");await sleep(110);}
    await sleep(RM?100:350);
    const i=Math.floor(Math.random()*caps.length),c=caps.splice(i,1)[0]||{c:COLORS[0]};
    play("plop");
    show={t:0,c:c.c,num:win};
    await sleep(RM?800:1700);
  }
  function after(){if(show){show=null;}if(!S.exclude&&caps.length<available().length){caps.push({x:G.cx,y:G.cy-G.R*.5,vx:0,vy:0,c:COLORS[caps.length%COLORS.length],rot:0});}}
  return{enter:build,rebuild:build,after,resize,draw,frame};
})();

/* =============== C. 낚시 =============== */
const fish=(function(){
  const COLS=["#ffb347","#ffd76a","#ff8a6b","#f2efe6","#f7a1c4","#9be0c8"];
  let F=[],L=60,surf=0,hook=null;
  function size(){surf=H*.13;L=Math.max(46,Math.min(190,Math.sqrt(W*(H-surf)/Math.max(1,F.length||available().length))*.62));}
  function spawn(num,i){return{num,x:rand(L,W-L),y:rand(surf+L,H-L*.6),a:rand(0,Math.PI*2),sp:rand(.5,.9),turn:0,c:COLS[i%COLS.length],wig:rand(0,6)};}
  function build(){F=[];size();available().forEach((n,i)=>F.push(spawn(n,i)));size();hook=null;}
  function resize(){size();F.forEach(f=>{f.x=Math.min(Math.max(f.x,L),W-L);f.y=Math.min(Math.max(f.y,surf+L*.6),H-L*.5);});}
  function drawFish(f){
    const b=L,h=L*.48;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
    const flip=Math.cos(f.a)<0?-1:1;ctx.scale(1,flip);
    const w=Math.sin(f.wig)*.25;
    ctx.fillStyle=f.c;ctx.beginPath();ctx.moveTo(-b*.4,0);ctx.lineTo(-b*.72,-h*.55+w*h);ctx.lineTo(-b*.72,h*.55+w*h);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(0,0,b*.48,h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.12)";ctx.beginPath();ctx.ellipse(-b*.05,-h*.42,b*.18,h*.14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#13262c";ctx.beginPath();ctx.arc(b*.3,-h*.1,Math.max(2,h*.08),0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle="#1b1b1b";ctx.font=Math.round(L*.3)+"px "+getComputedStyle(document.body).getPropertyValue("--font-display");ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(f.num,f.x-Math.cos(f.a)*L*.04,f.y+L*.02);
  }
  function swim(f,dt){
    f.turn+=(Math.random()-.5)*dt*3;f.turn*=.98;f.a+=f.turn*dt;
    const m=L*.7;let tx=null;
    if(f.x<m)tx=0;else if(f.x>W-m)tx=Math.PI;
    if(tx!=null){f.a+=Math.atan2(Math.sin(tx-f.a),Math.cos(tx-f.a))*dt*3;}
    if(f.y<surf+L*.7)f.a+=Math.atan2(Math.sin(Math.PI/2-f.a),Math.cos(Math.PI/2-f.a))*dt*3;
    if(f.y>H-L*.5)f.a+=Math.atan2(Math.sin(-Math.PI/2-f.a),Math.cos(-Math.PI/2-f.a))*dt*3;
    const v=f.sp*L*1.1;f.x+=Math.cos(f.a)*v*dt;f.y+=Math.sin(f.a)*v*dt;f.wig+=dt*8;
  }
  function frame(dt){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,surf,0,H);g.addColorStop(0,"#16697a");g.addColorStop(1,"#082a35");
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);const tt=performance.now()/1000;
    for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,surf+Math.sin(x*.015+tt*1.6)*5);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W+20;x+=20){const y=surf+Math.sin(x*.015+tt*1.6)*5;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
    for(const f of F){if(hook&&hook.fish===f)continue;swim(f,dt);}
    if(hook){
      const k=hook;k.t+=dt;
      if(k.phase==="drop"){const p=ease(Math.min(1,k.t/.5));k.y=-20+(k.ty+20)*p;if(k.t>=.5){k.phase="come";k.t=0;k.sx=k.fish.x;k.sy=k.fish.y;}}
      else if(k.phase==="come"){const p=easeIO(Math.min(1,k.t/k.dur));const f=k.fish;const ex=k.x-Math.cos(f.a)*L*.48,ey=k.y-Math.sin(f.a)*L*.1;
        const desired=Math.atan2(k.y-f.y,k.x-f.x);f.a+=Math.atan2(Math.sin(desired-f.a),Math.cos(desired-f.a))*Math.min(1,dt*6);
        f.x=k.sx+(ex-k.sx)*p;f.y=k.sy+(ey-k.sy)*p;f.wig+=dt*14;if(k.t>=k.dur){k.phase="bite";k.t=0;play("plop");}}
      else if(k.phase==="bite"){k.fish.wig+=dt*30;if(k.t>=.3){k.phase="pull";k.t=0;k.fy=k.fish.y;k.hy0=k.y;}}
      else if(k.phase==="pull"){const p=Math.min(1,k.t/.8),e=p*p;const f=k.fish;f.a=-Math.PI/2+Math.sin(k.t*30)*.35;
        k.y=k.hy0+(-L*1.5-k.hy0)*e;f.x=k.x;f.y=k.y+L*.48;f.wig+=dt*30;
        if(!k.splashed&&f.y<surf+L*.2){k.splashed=1;play("splash");burst(k.x,surf,30,{dir:0,spread:1.6,speed:L*6,life:.8,r:Math.max(2,L*.05),kind:"drop",colors:["#e3f4f2","#a8dde0","#ffffff"],grav:L*20,drag:.97});}
        if(p>=1)k.phase="gone";}
      // 낚싯줄, 찌, 바늘
      ctx.strokeStyle="rgba(240,240,240,.8)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(k.x,-10);ctx.lineTo(k.x,k.y);ctx.stroke();
      const by=Math.min(k.y,surf)-(k.phase==="bite"?-L*.15:0);
      if(k.y>surf-4&&k.phase!=="gone"){ctx.fillStyle="#f6f3ee";ctx.beginPath();ctx.arc(k.x,by-6,9,Math.PI,0);ctx.fill();ctx.fillStyle="#d8342c";ctx.beginPath();ctx.arc(k.x,by-6,9,0,Math.PI);ctx.fill();}
      ctx.strokeStyle="#d7dde0";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(k.x,k.y-12);ctx.lineTo(k.x,k.y+6);ctx.arc(k.x-7,k.y+6,7,0,Math.PI*.9);ctx.stroke();
    }
    for(const f of F)drawFish(f);
    drawParts(dt);
  }
  async function draw(win){
    const f=F.find(x=>x.num===win)||spawn(win,0);if(!F.includes(f))F.push(f);
    const hx=Math.min(W-L*1.5,Math.max(L*1.5,f.x+rand(-W*.15,W*.15))),hy=surf+(H-surf)*rand(.3,.45);
    hook={phase:"drop",t:0,x:hx,y:-20,ty:hy,fish:f,dur:RM?.3:1.1};
    play("plop");
    await new Promise(res=>{const iv=setInterval(()=>{if(!hook||hook.phase==="gone"){clearInterval(iv);res();}},50);});
    await sleep(150);
  }
  function after(win){F=F.filter(x=>!(hook&&x===hook.fish));if(!S.exclude)F.push(spawn(win,win));hook=null;}
  return{enter:build,rebuild:build,after,resize,draw,frame};
})();

/* =============== D. 슬롯머신 =============== */
const slot=(function(){
  const strip=$("strip"),machine=$("machine");let rh=100,seq=[],pos=1;
  function size(){rh=Math.max(60,Math.floor(Math.min(H*.27,W*.26)));machine.style.setProperty("--rh",rh+"px");render();}
  function fill(center){const av=available();const all=av.length?av:[center];seq=[pick(all),center,pick(all)];pos=1;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function render(){strip.innerHTML=seq.map(n=>'<div class="row">'+n+'</div>').join("");place();}
  function place(){strip.style.transform="translateY("+(-(pos-1)*rh)+"px)";}
  function enter(){const last=S.picks[S.picks.length-1];fill(last||available()[0]||1);size();}
  async function draw(win,pool){
    machine.classList.add("pulled");play("lever");await sleep(250);machine.classList.remove("pulled");
    machine.classList.add("spinning");
    const cur=seq[Math.round(pos)];const N=RM?6:38;const list=[seq[Math.round(pos)-1]||pick(pool),cur];
    for(let i=0;i<N;i++){let p;do{p=pick(pool);}while(pool.length>1&&p===list[list.length-1]);list.push(p);}
    if(pool.length>1&&list[list.length-1]===win)list[list.length-1]=pool.find(x=>x!==win);
    list.push(win);list.push(pick(pool));seq=list;render();
    const start=1,end=seq.length-2,dur=RM?600:2800;let t0=performance.now(),last=start;
    await new Promise(res=>{function step(now){const t=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-t,4);pos=start+(end-start)*e;place();
      if(Math.floor(pos+.5)!==last){last=Math.floor(pos+.5);play("tick");}
      if(t<1)requestAnimationFrame(step);else res();}requestAnimationFrame(step);});
    machine.classList.remove("spinning");play("stop");
    strip.children[end].classList.add("win");
    await sleep(RM?200:600);
    seq=[seq[end-1],win,seq[end+1]];pos=1;render();strip.children[1].classList.add("win");
  }
  function frame(dt){ctx.clearRect(0,0,W,H);drawParts(dt);}
  return{enter,rebuild:enter,after(){},resize:size,draw,frame};
})();

const MODES={cannon:cannonM,claw,gacha,fish,slot};
const M=()=>MODES[S.mode];

/* ---------- 공통 ---------- */
function resize(){const dpr=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);M().resize();}
function refresh(){
  const av=available().length;
  goBtn.disabled=busy||av===0;goBtn.textContent=av===0?"남은 번호 없음":"뽑기!";
  $("n").value=S.n;
  const ex=$("optExclude");ex.setAttribute("aria-pressed",S.exclude);ex.textContent=S.exclude?"뽑힌 번호 빼기":"뽑힌 번호 다시 넣기";
  const so=$("optSound");so.setAttribute("aria-pressed",S.sound);so.textContent=S.sound?"소리 켜짐":"소리 꺼짐";
  $("history").innerHTML=S.picks.length?"뽑힌 순서 "+S.picks.map(n=>"<b>"+n+"</b>").join(""):"아직 뽑은 번호가 없어요 · 남은 번호 "+av+"개";
  if(S.absent.length)$("history").innerHTML+=' <span>· 결석 '+S.absent.slice().sort((a,b)=>a-b).join(", ")+'</span>';
  $("about").textContent=ABOUT[S.mode];
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.mode===S.mode));
}
function setMode(m){if(busy||m===S.mode)return;S.mode=m;document.body.dataset.mode=m;parts=[];save();resize();M().enter();refresh();}
function setN(v){v=Math.max(2,Math.min(60,Math.round(Number(v)||S.n)));S.n=v;S.picks=S.picks.filter(x=>x<=v);S.absent=S.absent.filter(x=>x<=v);save();M().rebuild();refresh();}

async function go(){
  if(busy)return;const pool=available();if(!pool.length)return;
  audio();busy=true;refresh();
  const win=pool[Math.floor(Math.random()*pool.length)];
  await M().draw(win,pool);
  S.picks.push(win);save();
  const lastMode=S.mode;
  $("resLabel").textContent=LABEL[lastMode];$("resNum").innerHTML=win+"<small>번</small>";
  $("again").hidden=available().length===0;result.hidden=false;play("fanfare");$("close").focus();
  M().after(win);
  busy=false;refresh();
}
function closeRes(){result.hidden=true;goBtn.focus();}

goBtn.addEventListener("click",go);
$("again").addEventListener("click",()=>{closeRes();go();});
$("close").addEventListener("click",closeRes);
result.addEventListener("click",e=>{if(e.target===result)closeRes();});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setMode(t.dataset.mode)));
$("minus").addEventListener("click",()=>{if(!busy)setN(S.n-1);});
$("plus").addEventListener("click",()=>{if(!busy)setN(S.n+1);});
$("n").addEventListener("change",e=>{if(!busy)setN(e.target.value);else e.target.value=S.n;});
$("optExclude").addEventListener("click",()=>{if(busy)return;S.exclude=!S.exclude;save();M().rebuild();refresh();});
$("optSound").addEventListener("click",()=>{S.sound=!S.sound;if(S.sound)audio();save();refresh();});
$("reset").addEventListener("click",()=>{if(busy)return;S.picks=[];save();M().rebuild();refresh();});
document.addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();if(!result.hidden)closeRes();go();}
  else if(e.key==="Escape"&&!result.hidden)closeRes();
});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(resize,80);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);

let lt=performance.now();
function loop(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;M().frame(dt,now);requestAnimationFrame(loop);}

document.body.dataset.mode=S.mode;
resize();M().enter();refresh();requestAnimationFrame(loop);
})();
</script>
</body>
